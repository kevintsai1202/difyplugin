settings:
  - name: channel_secret
    type: secret-input
    required: true
    label:
      en_US: Channel Secret
      zh_Hans: 频道密钥
      zh_Hant: Channel Secret
      pt_BR: Segredo do Canal
      ja_JP: チャンネルシークレット
    placeholder:
      en_US: Please input your Channel Secret
      zh_Hans: 请输入你的频道密钥
      zh_Hant: 請輸入你的Channel Secret
      pt_BR: Por favor, insira seu Segredo do Canal
      ja_JP: チャネルシークレットを入力してください
  - name: channel_access_token
    type: secret-input
    required: true
    label:
      en_US: Channel Access Token
      zh_Hans: 频道访问令牌
      zh_Hant: Channel Access Token
      pt_BR: Token de Acesso do Canal
      ja_JP: チャネルアクセストークン
    placeholder:
      en_US: Please input your Channel Access Token
      zh_Hans: 请输入你的频道访问令牌
      zh_Hant: 請輸入Channel Access Token
      pt_BR: Por favor, insira seu Token de Acesso do Canal
      ja_JP: チャネルアクセストークンを入力してください
  - name: dify_api_key
    type: secret-input
    required: false
    label:
      en_US: Dify API Key (for image recognition upload)
      zh_Hans: Dify API 密钥（用于图片识别上传）
      zh_Hant: Dify API 金鑰（用於圖片識別上傳）
      pt_BR: Chave de API Dify (para upload de arquivos)
      ja_JP: Dify APIキー（画像認識アップロード用）
    placeholder:
      en_US: Please input your Dify API Key
      zh_Hans: 请输入你的Dify API密钥
      zh_Hant: 請輸入您的Dify API金鑰
      pt_BR: Por favor, insira sua Chave de API Dify
      ja_JP: Dify APIキーを入力してください
  - name: dify_api_url
    type: text-input
    required: false
    default: "https://api.dify.ai/v1"
    label:
      en_US: Dify API URL
      zh_Hans: Dify API 地址
      zh_Hant: Dify API 網址
      pt_BR: URL da API Dify
      ja_JP: Dify API URL
    placeholder:
      en_US: Please input your Dify API URL
      zh_Hans: 请输入你的Dify API地址
      zh_Hant: 請輸入您的Dify API網址
      pt_BR: Por favor, insira sua URL da API Dify
      ja_JP: Dify API URLを入力してください
  - name: img_variable_name
    type: text-input
    required: false
    default: img
    label:
      en_US: Image Variable Name
      zh_Hans: 图片变量名
      zh_Hant: 圖片變量名
      pt_BR: Nome da Variável de Imagem
      ja_JP: イメージ変数名
    placeholder:
      en_US: Please input your Image Variable Name
      zh_Hans: 请输入你的图片变量名
      zh_Hant: 請輸入您的圖片變量名
      pt_BR: Por favor, insira seu Nome da Variável de Imagem
      ja_JP: イメージ変数名を入力してください
  - name: img_prompt
    type: text-input
    required: false
    default: Describe the image uploaded in files
    label:
      en_US: Image Prompt
      zh_Hans: 图片提示词
      zh_Hant: 圖片提示詞
      pt_BR: Prompt de Imagem
      ja_JP: イメージプロンプト
    placeholder:
      en_US: Please input your Image Prompt
      zh_Hans: 请输入你的图片提示词
      zh_Hant: 請輸入您的圖片提示詞
      pt_BR: Por favor, insira seu Prompt de Imagem
      ja_JP: イメージプロンプトを入力してください
  - name: mdtoflex
    type: boolean
    required: false
    default: false
    label:
      en_US: Markdown to FlexMessage
      zh_Hans: Markdown转FlexMessage
      zh_Hant: Markdown轉FlexMessage
      pt_BR: Markdown para FlexMessage
      ja_JP: マークダウンからFlexMessageへ
    placeholder:
      en_US: Enable Markdown to FlexMessage conversion
      zh_Hans: 启用Markdown转FlexMessage
      zh_Hant: 啟用Markdown轉FlexMessage
      pt_BR: Habilitar conversão de Markdown para FlexMessage
      ja_JP: MarkdownからFlexMessageへの変換を有効にする

  - name: reset_command
    type: text-input
    required: false
    default: "reset"
    label:
      en_US: "Reset Command (e.g., /reset)"
      zh_Hans: "重置命令 (例如 /reset)"
      zh_Hant: "重置指令 (例如 /reset)"
      pt_BR: "Comando de Reset (e.g., /reset)"
      ja_JP: "リセットコマンド (例: /reset)"
    placeholder:
      en_US: "e.g., 'cleanup'. Min 5 chars."
      zh_Hans: "例如 'cleanup'。最少5个字符。"
      zh_Hant: "例如 'cleanup'。最少5個字元。"
      pt_BR: "e.g., 'cleanup'. Mínimo 5 caracteres."
      ja_JP: "例: 'cleanup'。5文字以上。"
  - name: reset_message
    type: text-input
    required: false
    default: "SYSTEM: Session history in Dify cleared."
    label:
      en_US: Reset Success Message
      zh_Hans: 重置成功消息
      zh_Hant: 重置成功訊息
      pt_BR: Mensagem de Sucesso de Reset
      ja_JP: リセット成功メッセージ
    placeholder:
      en_US: The reply message after clearing the history successfully.
      zh_Hans: 成功清除历史后的回复消息。
      zh_Hant: 成功清除歷史後的回覆訊息。
      pt_BR: A mensagem de resposta após limpar o histórico com sucesso.
      ja_JP: 履歴を正常にクリアした後の返信メッセージ。
  - name: error_message
    type: text-input
    required: false
    default: "Sorry, I encountered a problem, please try again later."
    label:
      en_US: Error Message
      zh_Hans: 错误消息
      zh_Hant: 錯誤訊息
      pt_BR: Mensagem de Erro
      ja_JP: エラーメッセージ
    placeholder:
      en_US: The reply message when an unexpected error occurs.
      zh_Hans: 发生意外错误时的回复消息。
      zh_Hant: 發生意外錯誤時的回覆訊息。
      pt_BR: A mensagem de resposta quando ocorre um erro inesperado.
      ja_JP: 予期せぬエラーが発生した場合の返信メッセージ。
  - name: help_command
    type: text-input
    required: false
    default: "help"
    label:
      en_US: "Help Command (e.g., /help)"
      zh_Hans: "帮助命令 (例如 /help)"
      zh_Hant: "幫助指令 (例如 /help)"
      pt_BR: "Comando de Ajuda (e.g., /help)"
      ja_JP: "ヘルプコマンド (例: /help)"
    placeholder:
      en_US: "Command to show a help message (without '/')"
      zh_Hans: "用于显示帮助信息的命令（不含“/”）"
      zh_Hant: "用於顯示幫助訊息的指令（不含「/」）"
      pt_BR: "Comando para exibir uma mensagem de ajuda (sem '/')"
      ja_JP: "ヘルプメッセージを表示するコマンド（「/」なし）"
  - name: help_message
    type: text-input
    required: false
    default: "Hello! I'm an AI assistant powered by Dify platform. In 1-on-1 chats, ask me directly. In groups, please @mention me. I support text and image messages. Use /help for this info, /reset to clear history."
    label:
      en_US: Help Message
      zh_Hans: 帮助信息
      zh_Hant: 幫助訊息
      pt_BR: Mensagem de Ajuda
      ja_JP: ヘルプメッセージ
    placeholder:
      en_US: The content of the help message.
      zh_Hans: 帮助信息的内容。
      zh_Hant: 幫助訊息的內容。
      pt_BR: O conteúdo da mensagem de ajuda.
      ja_JP: ヘルプメッセージの内容。
  - name: app
    type: app-selector
    required: true
    label:
      en_US: App
      zh_Hans: 应用
      zh_Hant: 應用 
      pt_BR: App
      ja_JP: アプリ
    placeholder:
      en_US: the app you want to use to answer Line messages
      zh_Hans: 你想要用来回答 Line 消息的应用
      zh_Hant: 你想用來回答 Line 訊息的應用
      pt_BR: o app que você deseja usar para responder mensagens do Line
      ja_JP: あなたが Line メッセージに回答するために使用するアプリ
endpoints:
  - endpoints/linebot.yaml

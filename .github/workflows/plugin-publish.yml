
name: Build Dify Plugin Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Dify Plugin CLI
        run: |
          curl -fL --retry 3 \
            -o dify-plugin \
            https://github.com/langgenius/dify-plugin-daemon/releases/latest/download/dify-plugin-linux-amd64
          chmod +x dify-plugin

      - name: Package Dify Plugin
        run: |
          ./dify-plugin plugin package . -o linebot-custom.difypkg
          test -s linebot-custom.difypkg

      - name: Upload Plugin Package
        uses: actions/upload-artifact@v4
        with:
          name: linebot-custom
          path: linebot-custom.difypkg
          if-no-files-found: error
